{% extends 'accounts/base.html' %}

{% block content %}

<div class="container mt-5">
    <h2>Sign-In</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Login
        </button>
    </form>

    <p class="mt-3">
        Dont have a account? 
        <a href="{% url 'register' %}">Create an account</a>
    </p>
</div>

{% endblock %}
