{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Stock Dashboard{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'stocks/css/stocks.css' %}">
    <link rel="stylesheet" href="{% static 'account/css/account.css' %}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=show_chart,bar_chart,emoji_events,trending_up,trending_down,equalizer,calendar_month,monitoring,candlestick_chart,price_check" />
</head>
<body>
    <div class="auth-container">
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
