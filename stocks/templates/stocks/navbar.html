
{% load static %}

<nav id="navbar" class="navbar">

    <!-- Links: Logo en naam -->
    <a id="navbar_link" href="/">
        <img
            src="{% static 'stocks/images/logo.jpg' %}"
            alt="Stock Dashboard logo"
        />
        <span>Stock Dashboard</span>
    </a>

    <!-- Midden: Searchbar -->
    <form id="ticker-search-form" method="get">
        <input
            type="text"
            id="ticker-input"
            name="ticker"
            autocapitalize="characters"
            oninput="this.value = this.value.toUpperCase()"
            placeholder="Search stock ticker, e.g. AAPL"
            autocomplete="off"
            list="ticker-suggestions"
            required
        />
        <datalist id="ticker-suggestions"></datalist>

        <button type="submit">Search</button>
    </form>

    <!-- Rechts: Account navigatie -->
    <div class="navbar-actions">

        <a href="/accounts/register" class="navbar-action">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="10" cy="7" r="4"/>
                <path d="M20 8v6M17 11h6"/>
            </svg>
            <span>Register</span>
        </a>

        <a href="/accounts/login" class="navbar-action">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
                <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
            </svg>
            <span>Login</span>
        </a>

    </div>

</nav>
